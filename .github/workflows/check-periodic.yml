name: Check periodic block sum
on:
  push:
    branches: [verify/periodic-block-sum]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            src/Lemmata/PeriodicFunctions
      - name: Install pinned Lean
        run: |
          curl -fsSL --retry 3 https://elan.lean-lang.org/elan-init.sh -o "$RUNNER_TEMP/install-elan.sh"
          sh "$RUNNER_TEMP/install-elan.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version
      - name: Build the changed module
        run: |
          lake exe mathlib/cache get Mathlib.Algebra.BigOperators.Group.Finset.Basic Mathlib.Algebra.Field.Defs
          lake build +Lemmata.PeriodicFunctions.PeriodicApplyMulAdd